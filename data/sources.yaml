# Source manifest — real, publicly published documents used by the Kohler Unified Enterprise AI Agent prototype.
#
# RULES (see NOTICE.md):
#   * Only documents Kohler (or the named third party) deliberately publishes for download.
#   * One HTTP request per document. No crawling, no sitemap walking, no bulk page scraping.
#   * method: script  -> fetched by scripts/fetch_sources.py
#     method: manual  -> host blocks non-browser clients or its terms prohibit automated access;
#                        open the URL in a browser and save to the given path yourself.
#     method: covered -> content already present in another fetched document; not fetched again.
#     method: dropped -> fetched but unusable (empty client-rendered shell); excluded from the corpus.
#     method: excluded -> out of scope (US/UK-specific); file parked under data/raw/_excluded/, not ingested.
#   * Files are stored under data/raw/ which is git-ignored. Never commit them.
#   * Real documents are used unmodified and attributed. Synthetic documents live in data/synthetic/ and are
#     clearly labelled fictional.
#
# Fields: id, title, domain (hr|finance|legal = internal knowledge bases; privacy|support|sustainability = customer-visible knowledge bases), region (global = parent, applies everywhere | IN = India child, overrides global),
#         audience (public|internal) — every internal document is visible to the whole internal team,
#         sensitivity (public|internal|restricted) — restricted additionally routes reasoning to the local model,
#         tags, kind (pdf|html), url, method, path (relative to data/raw), notes

defaults:
  audience: public
  sensitivity: public

sources:
